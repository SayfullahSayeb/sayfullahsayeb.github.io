# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: SayfullahSayeb/sayfullahsayeb.github.io   # ← Your exact repo name
  branch: main

# Where uploaded images go
media_folder: "static/images/uploads"
public_folder: "/images/uploads"

collections:

  # ==================== BLOG POSTS ====================
  - name: "posts"
    label: "Blog Posts"
    folder: "content/posts"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string", required: true}
      - {label: "Date", name: "date", widget: "datetime", default: "{{now}}", format: "YYYY-MM-DD HH:mm:ss"}
      - {label: "Draft", name: "draft", widget: "boolean", default: false}
      - {label: "Tags", name: "tags", widget: "list", allow_add: true, default: []}
      - {label: "Featured Image", name: "image", widget: "image"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Body", name: "body", widget: "markdown", required: true}

  # ==================== PROJECTS ====================
  - name: "projects"
    label: "Projects"
    folder: "content/projects"          # Change if your projects are in a different folder
    create: true
    extension: "md"
    format: "frontmatter"
    fields:
      - {label: "Title", name: "title", widget: "string", required: true}
      - {label: "Date", name: "date", widget: "datetime"}
      - {label: "Short Description", name: "description", widget: "text"}
      - {label: "Featured Image", name: "image", widget: "image"}
      - {label: "Technologies", name: "technologies", widget: "list", allow_add: true}
      - {label: "Live URL", name: "url", widget: "string"}
      - {label: "GitHub URL", name: "github", widget: "string"}
      - {label: "Body", name: "body", widget: "markdown"}

  # ==================== PHOTOGRAPHY ====================
  - name: "photography"
    label: "Photography"
    folder: "content/photography"       # Change if your photos are stored elsewhere
    create: true
    extension: "md"
    format: "frontmatter"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Date", name: "date", widget: "datetime"}
      - {label: "Location", name: "location", widget: "string"}
      - {label: "Photo", name: "image", widget: "image", required: true}
      - {label: "Body (optional caption)", name: "body", widget: "markdown"}