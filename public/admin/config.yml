# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: SayfullahSayeb/sayfullahsayeb.github.io   # ← Your exact repo name
  branch: main

# Where uploaded images go
media_folder: "static/images/uploads"
public_folder: "/images/uploads"

collections:

  # ==================== BLOG POSTS ====================
  - name: "posts"
    label: "Blog Posts"
    folder: "content/posts"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string", required: true}
      - {label: "Date", name: "date", widget: "datetime", default: "{{now}}", format: "YYYY-MM-DD HH:mm:ss"}
      - {label: "Draft", name: "draft", widget: "boolean", default: false}
      - {label: "Tags", name: "tags", widget: "list", allow_add: true, default: [], required: false}
      - {label: "Featured Image", name: "image", widget: "image", required: false}
      - {label: "Description", name: "description", widget: "text", required: false}
      - {label: "Body", name: "body", widget: "markdown", required: true}

  # ==================== PROJECTS ====================
  - name: "projects"
    label: "Projects"
    folder: "content/projects"
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    create: true
    extension: "md"
    format: "frontmatter"
    fields:
      - {label: "Title", name: "title", widget: "string", required: true}
      - {label: "Date", name: "date", widget: "datetime", required: false}
      - {label: "Short Description", name: "description", widget: "text", required: false}
      - {label: "Featured Image", name: "image", widget: "image", required: false}
      - {label: "Technologies", name: "technologies", widget: "list", allow_add: true, required: false}
      - {label: "Live URL", name: "live_url", widget: "string", required: false}
      - {label: "GitHub URL", name: "github", widget: "string", required: false}
      - {label: "Body", name: "body", widget: "markdown", required: false}

  # ==================== PHOTOGRAPHY ====================
  - name: "photography"
    label: "Photography"
    folder: "content/photography"
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    create: true
    extension: "md"
    format: "frontmatter"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Date", name: "date", widget: "datetime", default: "{{now}}"}
      - {label: "Location", name: "location", widget: "string", required: false}
      - {label: "Photo", name: "image", widget: "image", required: true}
      - {label: "Caption/Story", name: "body", widget: "markdown", required: false}